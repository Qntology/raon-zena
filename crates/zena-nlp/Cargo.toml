[package]
name = "zena-nlp"
description = "Raon Zena text understanding: Stanza (ONNX, 12 languages) morphology/syntax and granite-embedding-97m-multilingual-r2 sentence embeddings, ported from Qntology/logis-center"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
serde.workspace = true
serde_json.workspace = true
once_cell = "1"
regex = "1"
whatlang = "0.18"
candle-core.workspace = true
candle-nn.workspace = true
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
# Stanza runs on ONNX Runtime (vendored onnxruntime-rs of logis-center, loaded at run time).
ndarray = { version = "0.15", optional = true }
onnxruntime = { path = "../onnxruntime", optional = true }
onnxruntime-sys = { path = "../onnxruntime-sys", optional = true }

[dev-dependencies]
onnxruntime-sys = { path = "../onnxruntime-sys" }

[features]
default = ["stanza"]
stanza = ["dep:ndarray", "dep:onnxruntime", "dep:onnxruntime-sys"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
rocm = ["candle-core/rocm", "candle-nn/rocm"]
vulkan = ["candle-core/vulkan", "candle-nn/vulkan"]
metal = ["candle-core/metal", "candle-nn/metal"]
