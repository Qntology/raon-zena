[package]
name = "nlp-nms-router"
description = "Raon Zena natural-language request router: Korean/English NLP preprocessing, embedding scoring, span / semantic / spatial-text NMS (ported from Qntology/logis-center); NLP-NMS v2 with Stanza roles, granite embeddings and SDS"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zena-core = { path = "../zena-core" }
zena-lexicon = { path = "../zena-lexicon" }
zena-sds = { path = "../zena-sds" }
serde.workspace = true
anyhow = "1"
# The domain-neutral NLP-NMS core (premium-discount); `neural`: granite embeddings, `stanza`: + Stanza roles.
premium-discount-nms.workspace = true
premium-discount-nlp = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[features]
default = []
neural = ["premium-discount-nms/neural", "dep:premium-discount-nlp"]
stanza = ["neural", "premium-discount-nms/stanza", "premium-discount-nlp/stanza"]
