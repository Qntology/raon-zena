[package]
name = "raon-vision"
description = "KRAFTON Raon-VisionEncoder (SigLIP2 So400m/16, NaFlex) on candle: vision tower with noto-sandbox-style perforated passes (checkerboard / fovea + minesweeper opening), text tower for dictionary anchors, zero-shot screen scoring"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
raon-quant = { path = "../raon-quant" }
raon-infer = { path = "../raon-infer" }
zena-lexicon = { path = "../zena-lexicon" }
zena-sensor = { path = "../zena-sensor" }
anyhow = "1"
candle-core.workspace = true
candle-nn.workspace = true
serde.workspace = true
serde_json.workspace = true
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

[features]
default = []
cuda = ["raon-infer/cuda"]
rocm = ["raon-infer/rocm"]
vulkan = ["raon-infer/vulkan"]
metal = ["raon-infer/metal"]
