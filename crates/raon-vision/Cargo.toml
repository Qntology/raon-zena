[package]
name = "raon-vision"
description = "Raon Zena screen encoder: premium-discount-vision (SigLIP2 So400m NaFlex, Raon-VE and google SigLIP2) re-exported, with the word dictionary's vision nodes as anchor-bank domains"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
premium-discount-vision.workspace = true
zena-lexicon = { path = "../zena-lexicon" }
anyhow = "1"

[features]
default = []
cuda = ["premium-discount-vision/cuda"]
rocm = ["premium-discount-vision/rocm"]
vulkan = ["premium-discount-vision/vulkan"]
metal = ["premium-discount-vision/metal"]
