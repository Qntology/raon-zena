[workspace]
resolver = "2"
members = [
    "crates/zena-core",
    "crates/zena-sensor",
    "crates/raon-quant",
    "crates/nlp-nms-router",
    "crates/raon-infer",
    "crates/zena-lexicon",
    "crates/raon-vision",
    "crates/zena-avatar-mcp",
    "crates/premium-discount-mcp",
    "crates/zena-sds",
    "crates/zena-verdict",
    "crates/zena-nlp",
    "crates/onnxruntime",
    "crates/onnxruntime-sys",
    "apps/raon-zena",
    "apps/zena-lexicon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sungu-che/raon-zena"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
half = "2"
candle-core = "0.11.0"
candle-nn = "0.11.0"
# premium-discount's library crates (`crates/` of github.com/Qntology/premium-discount): the PD-Verdict judge,
# the hashId / wallet identity and the accessibility-navigation core. They depend on no LanceDB, HTTP, Tauri or
# model runtime, so they link into this workspace (LanceDB 0.41) as they do into premium-discount-app (0.31).
# Pinned by revision; to build against a checkout next to this one, add
# `[patch."https://github.com/Qntology/premium-discount"]` with `pd-verdict = { path = "../premium-discount/crates/pd-verdict" }`
# (and the same for pd-identity, pd-nav).
pd-verdict = { git = "https://github.com/Qntology/premium-discount", rev = "540311b8efdd6ee9e62baaf164b1db21241f60db" }
pd-identity = { git = "https://github.com/Qntology/premium-discount", rev = "540311b8efdd6ee9e62baaf164b1db21241f60db" }
pd-nav = { git = "https://github.com/Qntology/premium-discount", rev = "540311b8efdd6ee9e62baaf164b1db21241f60db" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
# Dependencies carry no debug info in dev builds: the LanceDB tree (lance, arrow, datafusion) is large.
debug = false

# LLM acceleration: the candle-rocm-vulkan fork (CUDA / ROCm-HIP / Vulkan / Metal backends, fused
# attention, TurboQuant), wired exactly like Qntology/logis-center. The fork tracks candle 0.11.0 and
# replaces the crates.io candle-core / candle-nn; Cargo.lock pins the commit (`cargo update -p candle-core`
# to move it). To build against a local checkout, swap the git lines for
# `path = "../candle-rocm-vulkan/candle-core"` etc.
[patch.crates-io]
candle-core = { git = "https://github.com/Qntology/candle-rocm-vulkan", branch = "master" }
candle-nn = { git = "https://github.com/Qntology/candle-rocm-vulkan", branch = "master" }

[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.raon-quant]
opt-level = 3
[profile.dev.package.raon-vision]
opt-level = 3
[profile.dev.package.zena-sensor]
opt-level = 3
