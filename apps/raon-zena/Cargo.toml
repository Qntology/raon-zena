[package]
name = "raon-zena"
description = "KRAFTON Raon Zena – Windows overlay client (winit + wgpu + windows-rs)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zena-core = { path = "../../crates/zena-core" }
zena-sensor = { path = "../../crates/zena-sensor" }
nlp-nms-router = { path = "../../crates/nlp-nms-router" }
raon-quant = { path = "../../crates/raon-quant" }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
wgpu = "30"
winit = "0.30"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
